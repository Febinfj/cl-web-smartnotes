<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Notes</title>

<style>
body {
  margin: 0; display: flex; height: 100vh;
  font-family: "Inter", sans-serif;
  background: #111827; color: #f3f4f6;
}
body.light { background: #f3f4f6; color: #1f2937; }

.sidebar {
  width: 250px; padding: 1rem; overflow-y: auto;
  background: #1f2937; display: flex; flex-direction: column; gap: .7rem;
}
body.light .sidebar { background: #e5e7eb; }

input, textarea, button {
  padding: .6rem; border-radius: 6px; border: none;
  font-size: .9rem; width: 100%;
}
input, textarea { background: #374151; color: #fff; }
body.light input, body.light textarea { background: #d1d5db; color: #000; }

button { background: #6366f1; color: white; cursor: pointer; }

.note-list { display: flex; flex-direction: column; gap: .4rem; }
.note-item {
  background: #374151; padding: .6rem; border-radius: 6px; cursor: pointer;
}
.note-item:hover { background: #4b5563; }
.note-item.active { background: #6366f1; }

.main {
  flex: 1; padding: 1.2rem; display: flex; flex-direction: column; gap: .8rem;
}

.title-input, textarea {
  resize: none; outline: none;
}
textarea { height: 55vh; }

.highlight { background: yellow; color: black; }
</style>
</head>

<body>

<div class="sidebar">
  <h2>⚡ Storm Notes</h2>
  <input id="search" placeholder="Search...">

  <button id="add">+ New</button>

  <button id="sort" style="font-size:1.2rem;">↓</button>
  <button id="theme" style="font-size:1.2rem;">🌙</button>

  <div class="note-list" id="list"></div>
</div>

<div class="main">
  <h3 id="titleHead">Select a note</h3>
  <input id="title" class="title-input" placeholder="Title" disabled>
  <textarea id="content" placeholder="Start typing..." disabled></textarea>
  <p id="info"></p>

  <div>
    <button id="save">Save</button>
    <button id="del">Delete</button>
    <button id="pin">Pin</button>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("storm_notes") || "[]");
let active = null, newest = true;

const g = id => document.getElementById(id);

function store() {
  localStorage.setItem("storm_notes", JSON.stringify(notes));
  renderList();
}

function summary(t) { return t.split(" ").slice(0,10).join(" ") + "..."; }
function tags(t) { return [...new Set((t.match(/\b\w+\b/g)||[]))].slice(0,4); }
function mood(t) {
  if (/happy|good|great/i.test(t)) return "😊";
  if (/sad|bad|angry/i.test(t)) return "😢";
  return "😐";
}

function renderList() {
  let q = g("search").value.toLowerCase();
  let list = g("list"); list.innerHTML = "";

  let filtered = notes.filter(n =>
    n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)
  );

  filtered.sort((a,b)=> newest?b.id-a.id:a.id-b.id);
  filtered.sort((a,b)=> b.pin-a.pin);

  filtered.forEach(n => {
    let div = document.createElement("div");
    div.className = "note-item" + (n.id===active ? " active":"");
    let t = n.title.replace(new RegExp(q,"gi"), m=>`<span class='highlight'>${m}</span>`);
    div.innerHTML = (n.pin?"📌 ":"") + t;
    div.onclick = ()=> openNote(n.id);
    list.appendChild(div);
  });

  g("sort").innerText = newest ? "↓" : "↑";
}

function openNote(id) {
  active = id;
  let n = notes.find(x=>x.id===id);
  g("titleHead").innerText = n.title;
  g("title").value = n.title;
  g("content").value = n.content;
  g("info").innerText = "Tags: " + n.tags.join(", ") + " | Mood: " + n.mood;
  g("title").disabled = g("content").disabled = false;
  renderList();
}

function addNote() {
  let t = prompt("Title:"); if(!t) return;
  let c = prompt("Content:"); if(!c) return;

  let n = { id: Date.now(), title:t, content:c, summary:summary(c),
            tags:tags(c), mood:mood(c), pin:false };

  notes.push(n); active = n.id; store(); openNote(n.id);
}

function saveNote() {
  if(!active) return;
  let n = notes.find(x=>x.id===active);
  n.title = g("title").value;
  n.content = g("content").value;
  n.summary = summary(n.content);
  n.tags = tags(n.content);
  n.mood = mood(n.content);
  store(); openNote(active);
}

function delNote() {
  notes = notes.filter(n=>n.id!==active);
  active=null; store();
  g("titleHead").innerText="Select a note";
  g("title").value=g("content").value="";  
  g("title").disabled=g("content").disabled=true;
  g("info").innerText="";
}

function pinNote() {
  if(!active) return;
  let n = notes.find(x=>x.id===active);
  n.pin=!n.pin; store(); openNote(active);
}

g("add").onclick = addNote;
g("save").onclick = saveNote;
g("del").onclick = delNote;
g("pin").onclick = pinNote;

g("sort").onclick = () => {
  newest = !newest;
  g("sort").innerText = newest ? "↓" : "↑";
  renderList();
};

g("search").oninput = renderList;

g("theme").onclick=()=>{
  document.body.classList.toggle("light");
  const light = document.body.classList.contains("light");
  g("theme").innerText = light ? "☀️" : "🌙";
  localStorage.setItem("storm_theme", light ? "light" : "dark");
};

if(localStorage.getItem("storm_theme")==="light"){
  document.body.classList.add("light");
  g("theme").innerText="☀️";
}

renderList();
</script>

</body>
</html>
