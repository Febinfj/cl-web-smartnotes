<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Notes</title>

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  display: flex;
  height: 100vh;
  background: #111827;
  color: #f3f4f6;
  overflow: hidden;
}

body.light {
  background: #f3f4f6;
  color: #1f2937;
}

.sidebar {
  width: 270px;
  background: #1f2937;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  border-right: 2px solid #374151;
  overflow-y: auto;
}

body.light .sidebar {
  background: #e5e7eb;
  border-right-color: #d1d5db;
}

.sidebar h2 {
  margin: 0;
  font-size: 1.4rem;
}

button, input {
  padding: 0.6rem;
  border-radius: 6px;
  border: none;
  font-size: 0.9rem;
}

input {
  width: 100%;
  background: #374151;
  color: #fff;
}

body.light input {
  background: #d1d5db;
  color: #000;
}

button {
  background: #6366f1;
  color: #fff;
  cursor: pointer;
  font-weight: 500;
}

button:hover {
  opacity: 0.9;
}

.note-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.note-item {
  padding: 0.7rem;
  background: #374151;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
  font-size: 0.85rem;
}

.note-item:hover {
  background: #4b5563;
}

.note-item.active {
  background: #6366f1;
}

body.light .note-item {
  background: #cbd5e1;
}
body.light .note-item:hover {
  background: #94a3b8;
}
body.light .note-item.active {
  background: #6366f1;
  color: white;
}

.main {
  flex: 1;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.editor {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

textarea, .title-input {
  width: 100%;
  background: #1f2937;
  border: none;
  padding: 0.8rem;
  border-radius: 6px;
  color: #fff;
  resize: none;
}

body.light textarea, body.light .title-input {
  background: #e5e7eb;
  color: #000;
}

.tags, .mood {
  font-size: 0.85rem;
  opacity: 0.7;
}

.highlight {
  background: yellow;
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>⚡ Storm Notes</h2>
  <input type="text" id="searchBar" placeholder="Search...">
  <button id="addBtn">+ New Note</button>
  <button id="sortBtn">Sort: Newest</button>
  <button id="themeBtn">Toggle Theme</button>

  <div class="note-list" id="noteList"></div>
</div>

<div class="main">
  <div class="main-header">
    <h3 id="currentTitle">Select a note</h3>
    <div>
      <button id="saveBtn">Save</button>
      <button id="deleteBtn">Delete</button>
      <button id="pinBtn">Pin</button>
    </div>
  </div>

  <div class="editor">
    <input class="title-input" id="titleInput" placeholder="Title..." disabled>
    <textarea id="contentInput" placeholder="Start typing..." disabled></textarea>
    <div class="tags" id="tagBox"></div>
    <div class="mood" id="moodBox"></div>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("storm_notes") || "[]");
let activeId = null;
let newest = true;

const get = id => document.getElementById(id);

function saveAll() {
  localStorage.setItem("storm_notes", JSON.stringify(notes));
  loadList();
}

function aiSummary(text) {
  return text.split(" ").slice(0, 10).join(" ") + (text.split(" ").length > 10 ? "..." : "");
}

function aiTags(text) {
  let w = text.toLowerCase().match(/\b\w+\b/g) || [];
  return [...new Set(w)].slice(0, 4);
}

function aiMood(text) {
  if (/happy|good|great|fun/i.test(text)) return "😊";
  if (/sad|angry|bad|hurt/i.test(text)) return "😢";
  return "😐";
}

function loadList() {
  const list = get("noteList");
  list.innerHTML = "";

  let search = get("searchBar").value.toLowerCase();

  let filtered = notes.filter(n =>
    n.title.toLowerCase().includes(search) ||
    n.content.toLowerCase().includes(search)
  );

  filtered.sort((a,b)=> newest ? b.id - a.id : a.id - b.id);
  filtered.sort((a,b)=> b.pin - a.pin);

  filtered.forEach(note => {
    let item = document.createElement("div");
    item.className = "note-item" + (note.id === activeId ? " active" : "");
    let title = note.title.toLowerCase().includes(search)
      ? note.title.replace(new RegExp(search,"gi"), m => `<span class='highlight'>${m}</span>`)
      : note.title;

    item.innerHTML = (note.pin ? "📌 " : "") + title;
    item.onclick = () => openNote(note.id);
    list.appendChild(item);
  });
}

function openNote(id) {
  activeId = id;
  let note = notes.find(n => n.id === id);

  get("currentTitle").innerText = note.title;
  get("titleInput").value = note.title;
  get("contentInput").value = note.content;
  get("tagBox").innerText = "Tags: " + note.tags.join(", ");
  get("moodBox").innerText = "Mood: " + note.mood;

  get("titleInput").disabled = false;
  get("contentInput").disabled = false;

  loadList();
}

function addNote() {
  let t = prompt("Title:");
  if (!t) return;
  let c = prompt("Content:");
  if (!c) return;

  let note = {
    id: Date.now(),
    title: t,
    content: c,
    summary: aiSummary(c),
    tags: aiTags(c),
    mood: aiMood(c),
    pin: false
  };

  notes.push(note);
  activeId = note.id;
  saveAll();
  openNote(note.id);
}

function saveNote() {
  if (!activeId) return;
  let n = notes.find(x => x.id === activeId);

  n.title = get("titleInput").value;
  n.content = get("contentInput").value;
  n.summary = aiSummary(n.content);
  n.tags = aiTags(n.content);
  n.mood = aiMood(n.content);

  saveAll();
  openNote(activeId);
}

function deleteNote() {
  if (!activeId) return;
  notes = notes.filter(n => n.id !== activeId);
  activeId = null;
  saveAll();
  resetEditor();
}

function togglePin() {
  if (!activeId) return;
  let n = notes.find(x => x.id === activeId);
  n.pin = !n.pin;
  saveAll();
  openNote(activeId);
}

function resetEditor() {
  get("currentTitle").innerText = "Select a note";
  get("titleInput").value = "";
  get("contentInput").value = "";
  get("tagBox").innerText = "";
  get("moodBox").innerText = "";
  get("titleInput").disabled = true;
  get("contentInput").disabled = true;
}

get("addBtn").onclick = addNote;
get("saveBtn").onclick = saveNote;
get("deleteBtn").onclick = deleteNote;
get("pinBtn").onclick = togglePin;

get("sortBtn").onclick = () => {
  newest = !newest;
  get("sortBtn").innerText = newest ? "Sort: Newest" : "Sort: Oldest";
  loadList();
};

get("themeBtn").onclick = () => {
  document.body.classList.toggle("light");
  localStorage.setItem("storm_theme", document.body.classList.contains("light") ? "light" : "dark");
};

get("searchBar").oninput = loadList;

if (localStorage.getItem("storm_theme") === "light")
  document.body.classList.add("light");

loadList();
</script>

</body>
</html>
